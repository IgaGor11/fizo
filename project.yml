name: FizikaEGE
options:
  bundleIdPrefix: ru.fizika.ege
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    PRODUCT_NAME: EasyFizi
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  FizikaEGE:
    type: application
    platform: iOS
    bundleId: ru.fizika.ege.app
    info:
      path: FizikaEGE/Info.plist
      properties:
        CFBundleDisplayName: EasyFizi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
    sources:
      - path: FizikaEGE
        excludes:
          - Info.plist
    # formulas.json и Assets.xcassets лежат в sources и автоматически
    # попадают в фазу Resources (стандартный layout Xcode).
    scheme:
      testTargets: []

schemes:
  FizikaEGE:
    build:
      targets:
        FizikaEGE: all
    run:
      config: Debug
    archive:
      config: Release
